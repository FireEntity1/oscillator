<!doctype html>
<html>
    <head>
        <title>oscillator</title>
        <link rel="stylesheet" href="css/synth.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Geo:ital@0;1&display=swap" rel="stylesheet">
    </head>
    <body>
        <header>
            <h1>oscillator</h1>
            <div class="header-links">
                <a href="https://github.com/FireEntity1/oscillator">repo</a>
                <a href="https://fireentity.space">made by fireentity</a>
            </div>
        </header>
        <div class="layout-container">
    <div class="left-edge-panel" id="left-panel">
        <label for="tracks" id="bpm-label">TRACKS</label>
        <div class="track active" data-instrument="lead1" onclick="selectInstrument('lead1')">Lead Synth</div>
        <div class="track" data-instrument="bass" onclick="selectInstrument('bass')">Bass Synth</div>
        <div class="track" data-instrument="pad" onclick="selectInstrument('pad')">Pad Synth</div>
        <hr />
        <label for="bpm" id="bpm-label">BPM</label>
        <input type="number" id="bpm" min="30" max="400" value="120" />
        <button onclick="play_all()" class="control play">PLAY</button>
    </div>

    <div class="left-panel">
        <h2>Track</h2>
        <div class="control">
            <input type="range" id="detune" min="0" max="50" value="0" />
            <label for="detune">Detune</label>
            <input type="range" id="voices" min="1" max="8" value="1" />
            <label for="voices">Voices</label>
            <div class="control">
                    <select id="type">
                        <option value="sawtooth">Sawtooth</option>
                        <option value="sine">Sine</option>
                        <option value="square">Square</option>
                        <option value="triangle">Triangle</option>
                    </select>
                </div>
        </div>

        <div class="control">
            <input type="range" id="volume" min="-120" max="0" value="-60" />
            <label for="volume">Volume</label>
        </div>

        <div>
            <input type="checkbox" id="wrap" />
            <label for="wrap">Wrap</label>
        </div>

        <hr />

        <h2>Chords</h2>
        <div class="control">
            <input type="range" id="chord-detune" min="0" max="50" value="0" />
            <label for="chord-detune">Detune</label>
            <input type="range" id="chord-voices" min="1" max="8" value="1" />
            <label for="chord-voices">Voices</label>
            <div class="control">
                    <select id="chord-type">
                        <option value="sawtooth">Sawtooth</option>
                        <option value="sine">Sine</option>
                        <option value="square">Square</option>
                        <option value="triangle">Triangle</option>
                    </select>
                </div>
        </div>

        <div class="control">
            <input type="range" id="chord-volume" min="-120" max="0" value="-40" />
            <label for="chord-volume">Volume</label>
        </div>
    </div>

    <div class="right-panel">
        <div id="melody-sequencer" class="melody-sequencer"></div>
    </div>
</div>
    </body>
    <script src="js/tone.js"></script>
</html>
