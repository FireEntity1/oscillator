<!doctype html>
<html>
    <head>
        <title>oscillator</title>
        <link rel="stylesheet" href="css/synth.css" />
    </head>
    <body>
        <h1>oscillator</h1>
        <div class="control">
            <select id="waveform">
                <option value="sine">Sine</option>
                <option value="sawtooth">Sawtooth</option>
                <option value="square">Square</option>
                <option value="triangle">Triangle</option>
            </select>
        </div>
        <div class="control">
            <input type="range" id="detune" min="0" max="50" value="0" />
            <label for="detune">Detune</label>
            <input type="range" id="voices" min="1" max="8" value="1" />
            <label for="voices">Voices</label>
        </div>
        <div class="control">
            <input type="range" id="volume" min="-120" max="0" value="-40" />
            <label for="volume">Volume</label>
        </div>
        <input id="note" type="text" value="" placeholder="e.g. C4, A5, G3" />
        <button onclick="play()">Play Notes</button>

        <input id="chord" type="text" placeholder="e.g. C, Am, G5" />
        <button onclick="play_chord()">Play Chord</button>
        <div id="selection"></div>
        <button onclick="play_select()">Play Selection</button>
        <script src="js/tone.js"></script>
        <div class="chord-sequencer"></div>
    </body>
</html>
